<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="goldTileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Background Tile -->
  <rect x="8" y="8" width="176" height="176" rx="42" fill="url(#tileBg)" filter="url(#tileShadow)" />
  <rect x="8" y="8" width="176" height="176" rx="42" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.3" />

  <!-- Shield Foreground -->
  <g transform="translate(42, 36)">
    <!-- Golden Geometric Shield Frame -->
    <path d="M54,4 L88,14 C88,48 54,82 54,82 C54,82 20,48 20,14 Z" fill="#F59E0B" />
    <!-- Inner Deep Emerald Inset -->
    <path d="M54,9 L82,18 C82,45 54,75 54,75 C54,75 26,45 26,18 Z" fill="#022C22" />
    <!-- Gold Taka Ribbon & Khata Symbol -->
    <path d="M41,24 h26 c2.6,0 4.8,2.2 4.8,4.8 v28 l-17.8,-7.5 l-17.8,7.5 v-28 c0,-2.6 2.2,-4.8 4.8,-4.8 z" fill="url(#goldTileGrad)" />
    <!-- Bangla Taka Horizontal Crossbar -->
    <rect x="36" y="36" width="36" height="4.5" rx="2" fill="#022C22" />
    <!-- Central Taka Stem -->
    <rect x="51.5" y="27" width="5" height="22" rx="2" fill="#022C22" />
    <!-- Voice Soundwave Micro-Dots -->
    <circle cx="54" cy="58" r="3.2" fill="#FEF3C7" />
  </g>
</svg>
