<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Outer Shield -->
  <path d="M24,3 L39,8.5 C39,24.5 24,43.5 24,43.5 C24,43.5 9,24.5 9,8.5 Z" fill="url(#shieldGrad)" filter="url(#shadow)" />
  <!-- Inner Shield Inset -->
  <path d="M24,6.5 L36,11 C36,23.5 24,39 24,39 C24,39 12,23.5 12,11 Z" fill="#022C22" />
  <!-- Gold Ribbon Bookmark -->
  <path d="M18.5,15 h11 c1.1,0 2,0.9 2,2 v15 l-7.5,-3.5 l-7.5,3.5 v-15 c0,-1.1 0.9,-2 2,-2 z" fill="url(#goldGrad)" />
  <!-- Bengali Taka Horizontal Bar -->
  <rect x="16" y="20.5" width="16" height="2.5" rx="1.2" fill="#022C22" />
  <!-- Bengali Taka Vertical Stem -->
  <rect x="22.5" y="16.5" width="3" height="11" rx="1.2" fill="#022C22" />
  <!-- Voice Wave Dot -->
  <circle cx="24" cy="30" r="1.3" fill="#FEF3C7" />
</svg>
